name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test managed runtime
        run: dotnet test FluidRuntime.slnx -c Release
      - name: Configure native probe
        run: cmake -S native -B native/build -A x64
      - name: Build native probe
        run: cmake --build native/build --config Release
      - name: Test native probe
        run: ctest --test-dir native/build -C Release --output-on-failure
      - name: Build native probe (Debug)
        run: cmake --build native/build --config Debug
      - name: Test native probe (Debug)
        run: ctest --test-dir native/build -C Debug --output-on-failure
      - name: Test native hook IPC
        run: >-
          dotnet run --project src/FluidRuntime -c Release --no-build -- hook-lab
          --target native/build/Release/fluidruntime-hook-target.exe
          --hook native/build/Release/fluidruntime-present-hook.dll
          --frames 120 --hold-ms 500 --hardware false
          --out artifacts/hook-ipc-ci.json
      - name: Test cooperative copy elision
        run: >-
          dotnet run --project src/FluidRuntime -c Release --no-build -- copy-elision-lab
          --target native/build/Release/fluidruntime-hook-target.exe
          --hook native/build/Release/fluidruntime-present-hook.dll
          --frames 120 --hold-ms 500 --gpu-timeout-ms 1000
          --trial-pairs 2 --warmup-pairs 0 --hardware false
          --out artifacts/copy-elision-ci.json
      - name: Test managed control plane
        run: >-
          dotnet run --project src/FluidRuntime -c Release --no-build -- manager-lab
          --target native/build/Release/fluidruntime-hook-target.exe
          --hook native/build/Release/fluidruntime-present-hook.dll
          --frames 120 --hold-ms 500 --gpu-timeout-ms 1000
          --trial-pairs 2 --warmup-pairs 0 --hardware false
          --out artifacts/manager-control-ci.json
      - name: Test native control policy matrix
        run: >-
          dotnet run --project src/FluidRuntime -c Release --no-build --
          control-policy-matrix
          --release-target native/build/Release/fluidruntime-hook-target.exe
          --release-hook native/build/Release/fluidruntime-present-hook.dll
          --debug-target native/build/Debug/fluidruntime-hook-target.exe
          --debug-hook native/build/Debug/fluidruntime-present-hook.dll
          --out artifacts/control-policy-matrix-ci.json
      - name: Test sustained managed copy elision
        run: >-
          dotnet run --project src/FluidRuntime -c Release --no-build --
          sustained-copy-lab
          --target native/build/Release/fluidruntime-hook-target.exe
          --hook native/build/Release/fluidruntime-present-hook.dll
          --copy-count 128 --trial-pairs 2 --warmup-pairs 0
          --hold-ms 50 --gpu-timeout-ms 5000 --hardware false
          --out artifacts/sustained-copy-ci.json
      - name: Test managed readback elision
        run: >-
          dotnet run --project src/FluidRuntime -c Release --no-build --
          readback-elision-lab
          --target native/build/Release/fluidruntime-hook-target.exe
          --hook native/build/Release/fluidruntime-present-hook.dll
          --trial-pairs 2 --warmup-pairs 0
          --hold-ms 50 --gpu-timeout-ms 5000 --hardware false
          --out artifacts/readback-elision-ci.json
      - name: Test managed upload elision
        run: >-
          dotnet run --project src/FluidRuntime -c Release --no-build --
          upload-elision-lab
          --target native/build/Release/fluidruntime-hook-target.exe
          --hook native/build/Release/fluidruntime-present-hook.dll
          --trial-pairs 2 --warmup-pairs 0
          --hold-ms 50 --gpu-timeout-ms 5000 --hardware false
          --out artifacts/upload-elision-ci.json
      - name: Test managed UpdateSubresource upload elision
        run: >-
          dotnet run --project src/FluidRuntime -c Release --no-build --
          update-upload-elision-lab
          --target native/build/Release/fluidruntime-hook-target.exe
          --hook native/build/Release/fluidruntime-present-hook.dll
          --trial-pairs 2 --warmup-pairs 0
          --candidate-action-count 128
          --hold-ms 50 --gpu-timeout-ms 5000 --hardware false
          --out artifacts/update-upload-elision-ci.json
      - name: Test owned D3D12 observation
        run: >-
          dotnet run --project src/FluidRuntime -c Release --no-build --
          d3d12-observe-lab
          --target native/build/Release/fluidruntime-d3d12-observation.exe
          --runs 2 --gpu-timeout-ms 10000 --process-timeout-ms 20000
          --hardware false --out artifacts/d3d12-observation-ci.json
      - name: Validate evidence contracts
        shell: pwsh
        run: |
          $hook = Get-Content artifacts/hook-ipc-ci.json -Raw | ConvertFrom-Json
          $copy = Get-Content artifacts/copy-elision-ci.json -Raw | ConvertFrom-Json
          $manager = Get-Content artifacts/manager-control-ci.json -Raw | ConvertFrom-Json
          $matrix = Get-Content artifacts/control-policy-matrix-ci.json -Raw | ConvertFrom-Json
          $sustained = Get-Content artifacts/sustained-copy-ci.json -Raw | ConvertFrom-Json
          $readback = Get-Content artifacts/readback-elision-ci.json -Raw | ConvertFrom-Json
          $upload = Get-Content artifacts/upload-elision-ci.json -Raw | ConvertFrom-Json
          $update = Get-Content artifacts/update-upload-elision-ci.json -Raw |
            ConvertFrom-Json
          $d3d12 = Get-Content artifacts/d3d12-observation-ci.json -Raw |
            ConvertFrom-Json
          if ($d3d12.mode -ne
                'fluidruntime-d3d12-observation-trace-v0.16.0' -or
              -not $d3d12.target_owned -or
              -not $d3d12.cooperative_load -or
              $d3d12.remote_injection -or
              -not $d3d12.read_only_observation -or
              $d3d12.actuation_enabled -or
              $d3d12.physical_transfer_bytes_measured -or
              $d3d12.render_driver -ne 'warp' -or
              $d3d12.captured_at_unix_ms_start -le 0 -or
              $d3d12.captured_at_unix_ms_end -lt
                $d3d12.captured_at_unix_ms_start -or
              $d3d12.completed_runs -ne 2 -or
              -not $d3d12.adapter_identity_stable -or
              $d3d12.queue_type -ne 'copy' -or
              $d3d12.buffer_bytes -ne 4194304 -or
              $d3d12.logical_upload_bytes_per_run -ne 4194304 -or
              $d3d12.logical_readback_bytes_per_run -ne 4194304 -or
              -not $d3d12.content_equivalent_in_all_runs -or
              -not $d3d12.fence_completed_in_all_runs -or
              $d3d12.claim_scope -ne
                'owned-d3d12-upload-default-readback-observation-only' -or
              $d3d12.performance_claim_allowed -or
              $d3d12.performance_claim_blockers -notcontains
                'observation-only-no-comparable-baseline' -or
              $d3d12.performance_claim_blockers -notcontains
                'logical-copy-bytes-not-physical-traffic') {
            throw 'D3D12 CI report violated the observation-only contract.'
          }
          if ($d3d12.runs | Where-Object {
              $_.mode -ne
                'fluidruntime-owned-d3d12-observation-v0.1.0' -or
              $_.render_driver -ne 'warp' -or
              $_.debug_warning_count -ne 0 -or
              $_.debug_error_count -ne 0 -or
              $_.queue.type -ne 'copy' -or
              $_.transfer.default_initial_state -ne 'common' -or
              $_.transfer.default_first_access_promotion -ne 'copy-dest' -or
              $_.transfer.default_state_before_readback_copy -ne 'copy-source' -or
              $_.transfer.expected_default_post_execute_state -ne
                'common-via-buffer-decay' -or
              $_.transfer.command_list_count -ne 1 -or
              $_.transfer.copy_command_count -ne 2 -or
              $_.transfer.resource_barrier_count -ne 1 -or
              $_.transfer.logical_total_copy_bytes -ne 8388608 -or
              $_.transfer.source_hash -ne $_.transfer.readback_hash -or
              -not $_.transfer.content_equivalent -or
              -not $_.transfer.wait_completed -or
              $_.memory.source -ne
                'idxgiadapter3-query-video-memory-info' -or
              $_.limitations.Count -lt 3
            }) {
            throw 'D3D12 native runs violated the fixed round-trip contract.'
          }
          if ($hook.mode -ne 'fluidruntime-hook-ipc-lab-v0.12.0' -or
              $hook.lost_sequence_count -ne 0 -or
              $hook.native_overrun_count -ne 0 -or
              -not $hook.rollback_restored) {
            throw 'Hook IPC CI report violated the v0.12 evidence contract.'
          }
          if ($copy.mode -ne 'fluidruntime-copy-elision-trace-v0.12.0' -or
              $copy.claim_scope -ne 'owned-d3d11-copy-elision-gpu-workload-only' -or
              $copy.control_plane -ne 'immutable-attach-options' -or
              $copy.included_trial_pairs -ne 2 -or
              $copy.applied_policy_actions_per_optimized_run -ne 0 -or
              $copy.performance_claim_allowed -ne $false -or
              $copy.performance_claim_blockers -notcontains 'insufficient-trial-pairs') {
            throw 'Copy-elision CI report violated the v0.12 evidence contract.'
          }
          if ($manager.mode -ne 'fluidruntime-manager-control-trace-v0.12.0' -or
              $manager.claim_scope -ne 'owned-d3d11-managed-policy-copy-elision-only' -or
              $manager.control_plane -ne 'managed-shared-memory-policy-v1' -or
              $manager.included_trial_pairs -ne 2 -or
              $manager.published_policy_epoch_per_optimized_run -ne 1 -or
              $manager.acknowledged_policy_epoch_per_optimized_run -ne 1 -or
              $manager.applied_policy_actions_per_optimized_run -ne 1 -or
              $manager.avoided_copy_count_per_optimized_run -ne 1 -or
              $manager.avoided_copy_bytes_per_optimized_run -ne 4096 -or
              $manager.performance_claim_allowed -ne $false -or
              $manager.performance_claim_blockers -notcontains 'insufficient-trial-pairs') {
            throw 'Manager CI report violated the v0.12 control contract.'
          }
          if ($matrix.mode -ne 'fluidruntime-control-policy-matrix-trace-v0.12.0' -or
              $matrix.expected_run_count -ne 320 -or
              $matrix.completed_run_count -ne 320 -or
              -not $matrix.deterministic_across_repetitions -or
              -not $matrix.deterministic_across_configurations -or
              -not $matrix.passed -or
              $matrix.cases.Count -ne 16 -or
              @($matrix.cases | Where-Object {
                -not $_.passed -or $_.completed_run_count -ne 20
              }).Count -ne 0) {
            throw 'Control-policy matrix violated the v0.12 fail-closed contract.'
          }
          if ($sustained.mode -ne 'fluidruntime-sustained-copy-elision-trace-v0.12.0' -or
              $sustained.sustained_buffer_bytes -ne 4194304 -or
              $sustained.redundant_copy_count_per_optimized_run -ne 128 -or
              $sustained.avoided_copy_bytes_per_optimized_run -ne 536870912 -or
              $sustained.included_trial_pairs -ne 2 -or
              -not $sustained.content_equivalent -or
              -not $sustained.rollback_restored_in_all_runs -or
              $sustained.performance_claim_allowed -ne $false -or
              $sustained.performance_claim_blockers -notcontains 'insufficient-trial-pairs' -or
              $sustained.performance_claim_blockers -notcontains 'software-adapter-not-hardware') {
            throw 'Sustained-copy CI report violated the v0.12 evidence contract.'
          }
          $sustainedBaselines = $sustained.trials | ForEach-Object { $_.baseline }
          $sustainedOptimized = $sustained.trials | ForEach-Object { $_.optimized }
          if ($sustainedBaselines | Where-Object {
              $_.observed_copy_count -ne 135 -or
              $_.forwarded_copy_count -ne 135 -or
              $_.skipped_copy_count -ne 0 -or
              -not $_.content_equivalent -or
              -not $_.rollback_restored
            }) {
            throw 'Sustained-copy baselines were not fully forwarded and equivalent.'
          }
          if ($sustainedOptimized | Where-Object {
              $_.observed_copy_count -ne 135 -or
              $_.forwarded_copy_count -ne 7 -or
              $_.skipped_copy_count -ne 128 -or
              $_.skipped_copy_bytes -ne 536870912 -or
              $_.applied_policy_actions -ne 128 -or
              $_.policy_status -ne 'exhausted' -or
              $_.sustained_source_hash -ne $_.sustained_destination_hash -or
              -not $_.content_equivalent -or
              -not $_.rollback_restored
            }) {
            throw 'Sustained-copy optimized runs violated the bounded policy contract.'
          }
          if ($readback.mode -ne 'fluidruntime-readback-elision-trace-v0.12.0' -or
              $readback.claim_scope -ne
                'owned-d3d11-default-to-staging-readback-workload-only' -or
              $readback.readback_buffer_bytes -ne 4194304 -or
              $readback.redundant_readback_copy_count_per_optimized_run -ne 64 -or
              $readback.avoided_readback_bytes_per_optimized_run -ne 268435456 -or
              $readback.included_trial_pairs -ne 2 -or
              -not $readback.content_equivalent -or
              -not $readback.rollback_restored_in_all_runs -or
              $readback.performance_claim_allowed -ne $false -or
              $readback.performance_claim_blockers -notcontains 'insufficient-trial-pairs' -or
              $readback.performance_claim_blockers -notcontains
                'software-adapter-not-hardware') {
            throw 'Readback CI report violated the v0.12 evidence contract.'
          }
          $readbackBaselines = $readback.trials | ForEach-Object { $_.baseline }
          $readbackOptimized = $readback.trials | ForEach-Object { $_.optimized }
          if ($readbackBaselines | Where-Object {
              $_.ring_abi_version -ne 9 -or
              $_.ring_capacity -ne 2048 -or
              $_.readback_copy_count -ne 65 -or
              $_.read_map_count -ne 65 -or
              $_.forwarded_copy_count -ne 71 -or
              $_.skipped_readback_copy_count -ne 0 -or
              -not $_.content_equivalent -or
              -not $_.rollback_restored
            }) {
            throw 'Readback baselines were not fully forwarded and equivalent.'
          }
          if ($readbackOptimized | Where-Object {
              $_.ring_abi_version -ne 9 -or
              $_.ring_capacity -ne 2048 -or
              $_.readback_copy_count -ne 65 -or
              $_.read_map_count -ne 65 -or
              $_.forwarded_copy_count -ne 7 -or
              $_.skipped_readback_copy_count -ne 64 -or
              $_.skipped_readback_copy_bytes -ne 268435456 -or
              $_.applied_policy_actions -ne 64 -or
              $_.policy_status -ne 'exhausted' -or
              $_.expected_hash -ne $_.first_map_hash -or
              $_.expected_hash -ne $_.final_map_hash -or
              $_.expected_hash -ne $_.post_detach_source_hash -or
              $_.expected_hash -ne $_.post_detach_destination_hash -or
              -not $_.content_equivalent -or
              -not $_.rollback_restored
            }) {
            throw 'Readback optimized runs violated the bounded policy contract.'
          }
          if ($upload.mode -ne 'fluidruntime-upload-elision-trace-v0.12.0' -or
              $upload.claim_scope -ne
                'owned-d3d11-writable-staging-to-default-upload-copy-workload-only' -or
              $upload.upload_buffer_bytes -ne 4194304 -or
              $upload.redundant_upload_copy_count_per_optimized_run -ne 64 -or
              $upload.avoided_upload_bytes_per_optimized_run -ne 268435456 -or
              $upload.included_trial_pairs -ne 2 -or
              $upload.performance_claim_basis -ne
                'gpu-interval-improvement-with-bounded-cpu-submission-overhead' -or
              $upload.cpu_submission_overhead_budget_microseconds -ne 1000 -or
              $upload.cpu_submission_overhead_budget_percent -ne 10 -or
              $upload.cpu_within_budget_pair_count -ne 2 -or
              -not $upload.content_equivalent -or
              -not $upload.rollback_restored_in_all_runs -or
              $upload.performance_claim_allowed -ne $false -or
              $upload.performance_claim_blockers -notcontains 'insufficient-trial-pairs' -or
              $upload.performance_claim_blockers -notcontains
                'software-adapter-not-hardware') {
            throw 'Upload CI report violated the v0.12 evidence contract.'
          }
          $uploadBaselines = $upload.trials | ForEach-Object { $_.baseline }
          $uploadOptimized = $upload.trials | ForEach-Object { $_.optimized }
          if ($uploadBaselines | Where-Object {
              $_.ring_abi_version -ne 9 -or
              $_.ring_capacity -ne 2048 -or
              $_.upload_copy_count -ne 65 -or
              $_.upload_write_map_count -ne 1 -or
              $_.forwarded_copy_count -ne 71 -or
              $_.skipped_upload_copy_count -ne 0 -or
              -not $_.content_equivalent -or
              -not $_.rollback_restored
            }) {
            throw 'Upload baselines were not fully forwarded and equivalent.'
          }
          if ($uploadOptimized | Where-Object {
              $_.ring_abi_version -ne 9 -or
              $_.ring_capacity -ne 2048 -or
              $_.upload_copy_count -ne 65 -or
              $_.upload_write_map_count -ne 1 -or
              $_.forwarded_copy_count -ne 7 -or
              $_.skipped_upload_copy_count -ne 64 -or
              $_.skipped_upload_copy_bytes -ne 268435456 -or
              $_.applied_policy_actions -ne 64 -or
              $_.policy_status -ne 'exhausted' -or
              $_.expected_hash -ne $_.post_detach_source_hash -or
              $_.expected_hash -ne $_.post_detach_destination_hash -or
              -not $_.content_equivalent -or
              -not $_.rollback_restored
            }) {
            throw 'Upload optimized runs violated the bounded policy contract.'
          }
          if ($update.mode -ne
                'fluidruntime-update-upload-elision-trace-v0.12.0' -or
              $update.claim_scope -ne
                'owned-d3d11-default-buffer-full-update-subresource-exact-content-workload-only' -or
              $update.buffer_bytes -ne 4194304 -or
              $update.required_update_count_per_run -ne 3 -or
              $update.redundant_update_count_per_optimized_run -ne 128 -or
              $update.avoided_update_bytes_per_optimized_run -ne 536870912 -or
              $update.exact_content_cache_resource_limit -ne 1 -or
              $update.exact_content_cache_byte_limit -ne 4194304 -or
              $update.included_trial_pairs -ne 2 -or
              -not $update.mutation_guard_passed -or
              -not $update.generation_guard_passed -or
              -not $update.content_equivalent -or
              -not $update.rollback_restored_in_all_runs -or
              $update.performance_claim_allowed -ne $false -or
              $update.performance_claim_blockers -notcontains
                'insufficient-trial-pairs' -or
              $update.performance_claim_blockers -notcontains
                'software-adapter-not-hardware') {
            throw 'Update-upload CI report violated the v0.12 evidence contract.'
          }
          $updateBaselines = $update.trials | ForEach-Object { $_.baseline }
          $updateOptimized = $update.trials | ForEach-Object { $_.optimized }
          if ($updateBaselines | Where-Object {
              $_.ring_abi_version -ne 9 -or
              $_.direct_upload_update_count -ne 131 -or
              $_.forwarded_update_subresource_count -ne 134 -or
              $_.skipped_update_subresource_count -ne 0 -or
              $_.content_cache_resource_count -ne 1 -or
              $_.content_cache_bytes -ne 4194304 -or
              -not $_.mutation_applied -or
              -not $_.generation_guard_applied -or
              $_.initial_hash -eq $_.final_hash -or
              $_.guard_hash -eq $_.final_hash -or
              $_.final_hash -ne $_.post_detach_destination_hash -or
              -not $_.content_equivalent -or
              -not $_.rollback_restored
            }) {
            throw 'Update-upload baselines were not fully forwarded and equivalent.'
          }
          if ($updateOptimized | Where-Object {
              $_.ring_abi_version -ne 9 -or
              $_.direct_upload_update_count -ne 131 -or
              $_.forwarded_update_subresource_count -ne 6 -or
              $_.skipped_update_subresource_count -ne 128 -or
              $_.skipped_update_subresource_bytes -ne 536870912 -or
              $_.applied_policy_actions -ne 128 -or
              $_.policy_status -ne 'exhausted' -or
              $_.final_hash -ne $_.post_detach_destination_hash -or
              -not $_.content_equivalent -or
              -not $_.rollback_restored
            }) {
            throw 'Update-upload optimized runs violated the bounded policy contract.'
          }
          $copyLane = $manager.control_lanes | Where-Object lane -eq 'copy-path'
          $readbackLane = $manager.control_lanes | Where-Object lane -eq 'vram-ram-readback'
          $uploadLane = $manager.control_lanes | Where-Object lane -eq 'ram-gpu-upload'
          $updateLane = $manager.control_lanes |
            Where-Object lane -eq 'ram-gpu-direct-update'
          $memoryLane = $manager.control_lanes | Where-Object lane -eq 'ram-vram-residency'
          if ($manager.control_lanes.Count -ne 7 -or
              $copyLane.state -ne 'active-owned-lab' -or
              -not $copyLane.actuation_enabled -or
              $readbackLane.state -ne 'active-owned-lab' -or
              -not $readbackLane.native_backend_available -or
              -not $readbackLane.actuation_enabled -or
              $uploadLane.state -ne 'active-owned-lab' -or
              -not $uploadLane.native_backend_available -or
              -not $uploadLane.actuation_enabled -or
              $updateLane.state -ne 'active-owned-lab' -or
              -not $updateLane.native_backend_available -or
              -not $updateLane.actuation_enabled -or
              $memoryLane.state -ne 'blocked-no-native-backend' -or
              $memoryLane.actuation_enabled) {
            throw 'Manager CI control lanes were not fail-closed.'
          }
          $runs = @(
            $copy.trials | ForEach-Object { $_.baseline; $_.optimized }
            $manager.trials | ForEach-Object { $_.baseline; $_.optimized }
          )
          if ($runs | Where-Object {
              $_.mode -ne 'fluidruntime-hook-ipc-lab-v0.12.0' -or
              $_.ring_abi_version -ne 9 -or
              -not $_.module_pinned_until_process_exit -or
              -not $_.automatic_lifetime_tracking -or
              $_.release_observation_scope -ne 'owned-returned-buffer-texture-interface' -or
              $_.subresource_provenance_scope -ne
                'owned-buffer-texture2d-map-update-copy-region' -or
              $_.gpu_view_write_scope -ne
                'owned-texture2d-single-subresource-rtv-uav-clear' -or
              $_.resource_retire_count -ne 1 -or
              $_.resource_destroy_count -ne 64 -or
              $_.active_resource_count -ne 7 -or
              $_.retired_resource_id_count -ne 65 -or
              $_.provenance_failure_count -ne 0 -or
              $_.release_hook_slot_count -lt 2 -or
              $_.release_hook_failure_count -ne 0 -or
              $_.retired_resource_identity_count + $_.resource_reuse_count -ne 65 -or
              $_.copy_subresource_region_count -ne 11 -or
              $_.copy_subresource_region_bytes -ne 8704 -or
              $_.redundant_subresource_copy_candidate_count -ne 5 -or
              $_.redundant_subresource_copy_bytes -ne 5120 -or
              $_.clear_render_target_view_count -ne 1 -or
              $_.clear_unordered_access_view_float_count -ne 1 -or
              $_.gpu_view_write_bytes -ne 5120 -or
              -not $_.subresource_content_equivalent -or
              $_.source_subresource_hash -ne $_.destination_subresource_hash -or
              -not $_.rollback_restored
            }) {
            throw 'CI runs violated the v0.12 lifecycle contract.'
          }
          $managedBaselines = $manager.trials | ForEach-Object { $_.baseline }
          if ($managedBaselines | Where-Object {
              $_.managed_control_policy_enabled -or
              $_.control_plane -ne 'observe-only' -or
              $_.control_policy_published_epoch -ne 0 -or
              $_.control_policy_status -ne 'none'
            }) {
            throw 'Manager baselines were not observe-only.'
          }
          $managedOptimized = $manager.trials | ForEach-Object { $_.optimized }
          if ($managedOptimized | Where-Object {
              -not $_.managed_control_policy_enabled -or
              $_.control_plane -ne 'managed-shared-memory-policy-v1' -or
              $_.control_policy_published_epoch -ne 1 -or
              $_.control_policy_acknowledged_epoch -ne 1 -or
              $_.control_policy_applied_action_count -ne 1 -or
              $_.control_policy_rejected_count -ne 0 -or
              $_.control_policy_status -ne 'exhausted'
            }) {
            throw 'Manager optimized runs violated the bounded policy contract.'
          }
