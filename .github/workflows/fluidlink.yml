name: FluidLink interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-process-contract:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        gateway-backend: [Python, Native]

    steps:
      - name: Check out FluidRuntime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out canonical FluidGateway contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: maxhuntert1414-max/FluidGateway
          ref: v0.69.0
          path: FluidGateway

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Test Gateway FluidLink endpoint
        working-directory: FluidGateway
        run: >-
          python -m unittest
          tests.test_fluidlink
          tests.test_fluidlink_v2
          -v

      - name: Configure native Gateway
        if: matrix.gateway-backend == 'Native'
        run: cmake -S FluidGateway/native -B FluidGateway/native/build -A x64

      - name: Build native Gateway
        if: matrix.gateway-backend == 'Native'
        run: cmake --build FluidGateway/native/build --config Release

      - name: Verify explicit Gateway selection and no fallback
        if: matrix.gateway-backend == 'Native'
        shell: powershell
        run: ./tools/Test-GatewayServerCommand.ps1 -GatewayPath "$PWD/FluidGateway"

      - name: Restore .NET projects
        run: dotnet restore FluidRuntime.slnx

      - name: Build managed runtime
        run: dotnet build FluidRuntime.slnx -c Release --no-restore

      - name: Test FluidLink client and Gateway authorization
        run: >-
          dotnet test tests/FluidRuntime.Tests/FluidRuntime.Tests.csproj
          --no-restore
          --filter "FullyQualifiedName~FluidLink|FullyQualifiedName~GatewayUpdateUpload|FullyQualifiedName~D3D12CopyElision|FullyQualifiedName~VulkanCopyLab|FullyQualifiedName~OwnedBinaryBinding|FullyQualifiedName~WindowsLoopbackPeerVerifier"

      - name: Test selected Gateway and .NET intercommunication
        shell: powershell
        run: >-
          ./tools/Test-FluidLinkIntegration.ps1
          -GatewayPath "$PWD/FluidGateway"
          -GatewayBackend ${{ matrix.gateway-backend }}

      - name: Test real in-process DLL binding and lifetime
        if: matrix.gateway-backend == 'Native'
        shell: pwsh
        run: |
          $env:FLUIDGATEWAY_DLL = "$PWD/FluidGateway/native/build/Release/FluidGatewayNative.dll"
          dotnet test tests/FluidRuntime.Tests/FluidRuntime.Tests.csproj -c Release --no-restore `
            --filter FullyQualifiedName~NativeGatewayTests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Configure native owned target
        run: cmake -S native -B native/build -A x64

      - name: Build native owned target
        run: cmake --build native/build --config Release

      - name: Test Gateway readback authority and native fallback
        if: matrix.gateway-backend == 'Native'
        shell: pwsh
        run: |
          $env:FLUIDGATEWAY_DLL = "$PWD/FluidGateway/native/build/Release/FluidGatewayNative.dll"
          $env:FLUIDRUNTIME_NATIVE = "$PWD/native/build/Release"
          dotnet test tests/FluidRuntime.Tests/FluidRuntime.Tests.csproj -c Release --no-restore `
            --filter FullyQualifiedName~GatewayReadbackTests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test both Gateway backends with owned graphics targets
        if: matrix.gateway-backend == 'Native'
        shell: powershell
        run: >-
          ./tools/Test-GatewayBackends.ps1
          -GatewayLibrary "$PWD/FluidGateway/native/build/Release/FluidGatewayNative.dll"
          -GatewayExecutable "$PWD/FluidGateway/native/build/Release/fluidgateway-native.exe"
          -SkipVulkan

      - name: Verify native authorization and actuation without Python on PATH
        if: matrix.gateway-backend == 'Native'
        shell: powershell
        run: >-
          ./tools/Test-NativeGatewayStandalone.ps1
          -GatewayExecutable "$PWD/FluidGateway/native/build/Release/fluidgateway-native.exe"

      - name: Test Gateway-authorized native actuation and fallback
        shell: powershell
        run: >-
          ./tools/Test-GatewayManagedUpdateUpload.ps1
          -GatewayPath "$PWD/FluidGateway"
          -GatewayBackend ${{ matrix.gateway-backend }}
          -CandidateActionCount 128
          -TrialPairs 2
          -WarmupPairs 0
          -Hardware $false

      - name: Test Gateway-authorized D3D12 actuation and fallback
        shell: powershell
        run: >-
          ./tools/Test-GatewayManagedD3D12Copy.ps1
          -GatewayPath "$PWD/FluidGateway"
          -GatewayBackend ${{ matrix.gateway-backend }}
          -CandidateActionCount 128
          -TrialPairs 2
          -WarmupPairs 0
          -Hardware $false

      - name: Pack FluidLink
        run: >-
          dotnet pack src/FluidLink/FluidLink.csproj
          -c Release
          --no-restore
          -o artifacts/packages

      - name: Upload FluidLink package and probe report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fluidlink-v2-${{ matrix.gateway-backend }}
          path: |
            artifacts/packages/FluidLink.0.5.0.nupkg
            artifacts/gateway-backends/*.json
            artifacts/fluidlink-cross-process.json
            artifacts/native-gateway-standalone*.json
            artifacts/gateway-update-upload-control-128.json
            artifacts/gateway-update-upload-invalid-response-fail-closed-128.json
            artifacts/gateway-update-upload-fail-closed-128.json
            artifacts/gateway-update-upload-slow-response-fail-closed-128.json
            artifacts/gateway-d3d12-transfer-control.json
            artifacts/gateway-d3d12-transfer-invalid-response-fail-closed.json
            artifacts/gateway-d3d12-transfer-fail-closed.json
            artifacts/gateway-d3d12-transfer-slow-response-fail-closed.json
