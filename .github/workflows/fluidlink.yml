name: FluidLink interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-process-contract:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out FluidRuntime
        uses: actions/checkout@v7

      - name: Check out canonical FluidGateway contract
        uses: actions/checkout@v7
        with:
          repository: maxhuntert1414-max/FluidGateway
          ref: v0.63.0
          path: FluidGateway

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test Gateway FluidLink endpoint
        working-directory: FluidGateway
        run: python -m unittest tests.test_fluidlink -v

      - name: Restore .NET projects
        run: dotnet restore FluidRuntime.slnx

      - name: Test FluidLink client
        run: >-
          dotnet test tests/FluidRuntime.Tests/FluidRuntime.Tests.csproj
          --no-restore
          --filter FullyQualifiedName~FluidLinkClientTests

      - name: Test Python and .NET intercommunication
        shell: powershell
        run: >-
          ./tools/Test-FluidLinkIntegration.ps1
          -GatewayPath "$PWD/FluidGateway"

      - name: Pack FluidLink
        run: >-
          dotnet pack src/FluidLink/FluidLink.csproj
          -c Release
          --no-restore
          -o artifacts/packages

      - name: Upload FluidLink package and probe report
        uses: actions/upload-artifact@v7
        with:
          name: fluidlink-v1
          path: |
            artifacts/packages/FluidLink.0.1.0.nupkg
            artifacts/fluidlink-cross-process.json
